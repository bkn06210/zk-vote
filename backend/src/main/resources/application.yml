spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zkvote?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:zkvote}
    password: ${DB_PASSWORD:zkvote1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080


app:
  secret-salt: ${SECRET_SALT:devsalt1234}

merkle:
  script:
    path: ${MERKLE_SCRIPT_PATH:scripts/compute_merkle_root.js}
  proof-script:
    path: ${MERKLE_PROOF_SCRIPT_PATH:scripts/compute_merkle_proof.js}

zkp:
  files:
    path: ${ZKP_FILES_PATH:../server/zkp}
  verify-script:
    path: ${ZKP_VERIFY_SCRIPT_PATH:scripts/verify_proof.js}

blockchain:
  enabled: ${BLOCKCHAIN_ENABLED:false}
  rpc-url: ${BLOCKCHAIN_RPC_URL:}
  private-key: ${BLOCKCHAIN_PRIVATE_KEY:}
  record-script:
    path: ${BLOCKCHAIN_SCRIPT_PATH:scripts/record_vote.js}
