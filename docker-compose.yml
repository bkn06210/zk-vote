services:
  mysql:
    image: mysql:8.0
    container_name: zkvote-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: zkvote
      MYSQL_USER: zkvote
      MYSQL_PASSWORD: zkvote1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: zkvote-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
